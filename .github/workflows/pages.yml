name: Verify, build and deploy JupyterLite + Jupyter Book

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate records, synthesis, rendering and exports
        run: python -m unittest discover -s tests -v
      - name: Execute notebooks in fresh kernels and stage demonstration outputs
        run: python scripts/verify_notebooks.py --book-output _build-input/book
      - uses: actions/upload-artifact@v4
        with:
          name: demonstrated-book
          path: _build-input/book

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: demonstrated-book
          path: _build-input/book
      - name: Build Jupyter Book with isolated demonstration outputs
        run: jupyter-book build _build-input/book --warningiserror
      - name: Build JupyterLite with clean learner notebooks
        run: jupyter lite build --contents book/notebooks --output-dir _site/lite
      - name: Assemble static site
        run: |
          mkdir -p _site/book
          cp -a _build-input/book/_build/html/. _site/book/
          cp -a site/. _site/
          touch _site/.nojekyll
      - uses: actions/upload-artifact@v4
        with:
          name: static-site-preview
          path: _site
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, build]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
